name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --verify-tag --title "TierwiseAgents ${TAG}" --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag --title "TierwiseAgents ${TAG}" --generate-notes
          fi
