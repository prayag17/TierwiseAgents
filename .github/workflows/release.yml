name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.3.1 (created on this branch if it does not exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Tag must look like v1.2.3, got: $TAG"; exit 1 ;; esac
          notes=".github/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TierwiseAgents ${TAG}" --notes-file "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TierwiseAgents ${TAG}" --generate-notes
          fi
